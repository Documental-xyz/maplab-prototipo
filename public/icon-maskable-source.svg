<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0f172a"/>
  <g transform="translate(72 72) scale(0.72)">
    
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa34d"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- subtle grid lines (latitudes) -->
    <g stroke="#334155" stroke-width="1.5" opacity="0.4">
      <line x1="0" y1="160" x2="512" y2="160"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="352" x2="512" y2="352"/>
      <line x1="160" y1="0" x2="160" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="352" y1="0" x2="352" y2="512"/>
    </g>
    <!-- stylized continent (polygon) -->
    <path d="M 130 180 Q 160 130 220 145 Q 290 110 340 170 Q 400 200 380 260 Q 410 320 350 350 Q 300 400 240 360 Q 180 380 150 320 Q 110 270 130 180 Z"
          fill="url(#accent)" opacity="0.92" stroke="#5d3fd3" stroke-width="3"/>
    <!-- route (line) -->
    <path d="M 110 380 Q 180 320 256 340 T 420 200"
          fill="none" stroke="#e8743b" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- points of interest -->
    <circle cx="180" cy="220" r="10" fill="#e4192b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="320" cy="280" r="10" fill="#e4192b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="180" r="8" fill="#f2c14d" stroke="#1f2937" stroke-width="2"/>
  </g>
  <!-- ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#475569" stroke-width="6"/>

  </g>
</svg>